name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node examples/basic.mjs > /tmp/agent-receipt.json
      - run: node -e "JSON.parse(require('fs').readFileSync('/tmp/agent-receipt.json','utf8'))"
